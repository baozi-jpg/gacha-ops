name: Sync website download

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialize promotions. A rerun always resolves the current stable release.
concurrency:
  group: website-download
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout synchronization code from main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Check synchronization behavior
        run: python3 -B -m unittest discover -s scripts -p 'test_sync_download.py'

      - name: Verify tools
        run: |
          gh --version
          aws --version

      - name: Synchronize and verify public download
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
        run: python3 -B scripts/sync-download.py
