name: CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore GachaOps.slnx --configfile NuGet.Config --ignore-failed-sources

      - name: Build solution
        run: dotnet build GachaOps.slnx --configuration Release --no-restore

      - name: Run offline tests
        run: dotnet run --project tests/GachaOps.Core.Tests/GachaOps.Core.Tests.csproj --configuration Release --no-build

      - name: Check history details layout
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File ./scripts/test-history-layout.ps1
